name: Release NurseOCReport

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

concurrency:
  group: nurseocreport-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository privacy and policy
        run: python3 scripts/check_privacy.py

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          BASE="${VERSION%%-*}"
          IFS='.' read -r MAJ MIN PAT _ <<< "$BASE"
          MAJ="${MAJ//[^0-9]/}"; MIN="${MIN//[^0-9]/}"; PAT="${PAT//[^0-9]/}"
          MAJ="${MAJ:-0}"; MIN="${MIN:-0}"; PAT="${PAT:-0}"
          VCODE=$((10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PAT))
          if (( VCODE <= 0 )); then
            VCODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VCODE}" >> "$GITHUB_OUTPUT"

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing secrets before downloading tools
        shell: bash
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Set secret SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "::error::Set secret SIGNING_PASSWORD"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required Android SDK, NDK, and CMake packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch C++ dependencies and stage Android OCR model assets
        run: python3 scripts/fetch_deps.py --copy-android-assets

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode="${{ needs.prepare.outputs.version_code }}" \
            -PversionName="${{ needs.prepare.outputs.version }}"

      - name: Zipalign, sign with PKCS12 keystore, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)"
          test -f "$UNSIGNED_APK"
          mkdir -p out work

          APK_NAME="NurseOCReport-${{ needs.prepare.outputs.tag }}-android.apk"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" work/aligned.apk

          EFFECTIVE_KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-$SIGNING_PASSWORD}"
          export EFFECTIVE_KEY_PASSWORD
          ALIAS_ARGS=()
          if [[ -n "${SIGNING_KEY_ALIAS:-}" ]]; then
            ALIAS_ARGS+=(--ks-key-alias "$SIGNING_KEY_ALIAS")
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            "${ALIAS_ARGS[@]}" \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:EFFECTIVE_KEY_PASSWORD \
            --out "out/$APK_NAME" work/aligned.apk

          rm -f "$RUNNER_TEMP/release.p12"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "out/$APK_NAME"

          BADGING_BIN="$BUILD_TOOLS/aapt"
          if [[ ! -x "$BADGING_BIN" ]]; then
            BADGING_BIN="$BUILD_TOOLS/aapt2"
          fi
          "$BADGING_BIN" dump badging "out/$APK_NAME" | tee work/badging.txt
          grep -q "package: name='com.scluzlep.nurseocreport'" work/badging.txt
          grep -q "launchable-activity:" work/badging.txt

      - name: Upload signed Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: out/NurseOCReport-*-android.apk
          retention-days: 1
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
          - arch: x86
            msvc_arch: amd64_x86
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Fetch third-party sources, YY-Thunks, and OCR models
        run: python scripts/fetch_deps.py

      - name: Configure, build, and test Win7+ binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vsNinja = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($vsNinja) {
              $env:PATH = "$($vsNinja.DirectoryName);$env:PATH"
            } else {
              choco install -y ninja
            }
          }
          $arch = "${{ matrix.arch }}"
          $bdir = "build-$arch"
          cmake -S . -B $bdir -G Ninja -DCMAKE_BUILD_TYPE=Release -DNURSEOCR_USE_YY_THUNKS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $bdir -j
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\$bdir\core_tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_win7_pe.py "$bdir/windows/NurseOCReport.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage standalone Win7+ EXE and run self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = "${{ matrix.arch }}"
          $tag = "${{ needs.prepare.outputs.tag }}"
          if (Test-Path "out") { Remove-Item -Recurse -Force "out" }
          New-Item -ItemType Directory -Force -Path "out" | Out-Null
          $exeName = "NurseOCReport-$tag-win7-$arch.exe"
          $exePath = "out/$exeName"
          Copy-Item "build-$arch/windows/NurseOCReport.exe" $exePath -Force

          $cacheRoot = Join-Path $env:LOCALAPPDATA "NurseOCReport\cache"
          if (Test-Path $cacheRoot) { Remove-Item -Recurse -Force $cacheRoot }

          $exeFull = (Resolve-Path $exePath).Path
          $proc = Start-Process -FilePath $exeFull -ArgumentList "--self-test" -WorkingDirectory (Split-Path $exeFull) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "$exeName --self-test failed with exit code $($proc.ExitCode)"
          }
          $cachedFiles = Get-ChildItem -Path $cacheRoot -Recurse -File -ErrorAction SilentlyContinue
          if ($cachedFiles.Count -lt 4) {
            throw "Expected at least 4 cached OCR model files under $cacheRoot, found $($cachedFiles.Count)"
          }
          Get-Item $exePath | Select-Object FullName, Length

      - name: Upload Windows standalone EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: out/NurseOCReport-${{ needs.prepare.outputs.tag }}-win7-${{ matrix.arch }}.exe
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [prepare, build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Prepare checksums and publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          mkdir -p release_assets
          find release_staging -type f \( -name "*.apk" -o -name "*.exe" \) -exec cp -v {} release_assets/ \;
          test "$(find release_assets -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find release_assets -maxdepth 1 -name '*.exe' | wc -l)" -eq 2
          (cd release_assets && sha256sum * > SHA256SUMS.txt)
          ls -la release_assets

          printf '%s\n' \
            'Offline nurse workload OCR and weighted calculation tool for Windows 7 SP1+ (x64/x86) and Android 7.0+.' \
            '' \
            'Fixes and improvements in v0.2.1:' \
            '- Fixed Android crash when opening dialogs (name import, add/edit staff, add/delete row, edit shift weight, year/month settings) by upgrading activity-compose to 1.12.4 for Miuix NavigationBackHandler compatibility and hoisting WorkloadTab SuperDialogs.' \
            '- Unified button sizes across all Android tabs, quick-fill review grid, and dialogs, and enabled workload name import before loading a photo.' \
            '- Preserved cross-border descending digit stems in table cell extraction and hardened PP-OCRv5 + MNIST-12 topology/disagreement review gating so open-top handwritten 4s crossing bottom grid lines are recognized as 4 or flagged for review instead of silently misread as 6.' \
            '- Added multi-size Windows EXE application and window icon matching the Android launcher icon.' \
            > release_notes.txt

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "NurseOCReport $TAG" --notes-file release_notes.txt
          else
            gh release create "$TAG" release_assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "NurseOCReport $TAG" \
              --notes-file release_notes.txt
          fi
